name: Sincronizar datos reales (Perú en Datos)

# Corre los 3 conectores (Contraloría, INEI-RENAMU, MEF) y deja los
# resultados en data/*.json. Los conectores solo usan la librería estándar
# de Python (no hace falta pip install nada).
#
# IMPORTANTE — esto nunca se ha corrido con acceso de red real todavía.
# Se escribió y probó con datos simulados porque el entorno de desarrollo
# tenía bloqueado el acceso a los dominios .gob.pe. La primera corrida real
# va a ser AQUÍ, en GitHub Actions — revisa el resumen que imprime al final
# y el contenido de data/*.json (especialmente "columnas_detectadas" y
# "estado") antes de confiar en los números.
#
# El archivo del MEF pesa ~2.3 GB. Para una primera prueba rápida, usa
# "Run workflow" y pon un valor en mef_max_mb (ej. 50) para cortar la
# descarga a los primeros N megabytes — el resultado quedará marcado como
# muestra parcial ("muestra_parcial": true), no como el total real.
# Déjalo vacío para procesar el archivo completo.

on:
  schedule:
    # 12:00 UTC = 07:00 hora de Lima, una vez por semana (domingo).
    # El archivo del MEF es grande — no tiene sentido bajarlo entero todos
    # los días. Ajustar si se prefiere otra frecuencia.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      mef_max_mb:
        description: "Cortar el CSV del MEF a los primeros N MB (vacío = archivo completo)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar los 3 conectores
        env:
          MEF_MAX_MB: ${{ github.event.inputs.mef_max_mb }}
        run: python connectors/run_all.py

      - name: Mostrar un resumen rápido de lo que se detectó
        if: always()
        run: python connectors/print_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Subir data/*.json como artifact (siempre, para poder revisar sin esperar el commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-reales
          path: data/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Confirmar y subir cambios (solo si hubo cambios)
        run: |
          git config user.name "peru-en-datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
            exit 0
          fi
          git commit -m "Actualiza datos reales (MEF/INEI/Contraloría) - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # El repo puede haber recibido otros commits mientras corría este
          # job (ej. una subida manual, u otro workflow) — "git push" a
          # secas falla con "[rejected] (fetch first)" en ese caso. En vez
          # de eso, se trae lo nuevo del remoto y se combina, prefiriendo
          # SIEMPRE nuestros data/*.json si hay choque de líneas (son datos
          # generados, no hace falta "preservar" la versión remota), con
          # reintentos por si alguien más empuja justo entre el fetch y el
          # push.
          for intento in 1 2 3 4 5; do
            git fetch origin main
            if git merge origin/main --no-edit -X ours -m "Merge automático (sync-datos)"; then
              if git push origin main; then
                echo "Subido correctamente."
                exit 0
              fi
            fi
            echo "Intento $intento falló (probablemente otro push a la vez), reintentando..."
            sleep $((intento * 5))
          done
          echo "No se pudo subir después de varios intentos." >&2
          exit 1
