name: Sincronizar licitaciones

# Este workflow SOLO toca archivos dentro de licitaciones/ (data.json y el registro
# de muestra). No modifica ninguna otra parte del sitio.

on:
  schedule:
    # 11:00 UTC = 06:00 hora de Lima. Ajustar si se prefiere otro horario.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña "Actions" en GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar sincronización
        run: python licitaciones/sync.py

      - name: Confirmar y subir cambios (solo si hubo cambios)
        run: |
          git config user.name "humen-licitaciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add licitaciones/data.json licitaciones/sample_raw_release.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza licitaciones ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
