name: Sincronizar licitaciones

# Este workflow SOLO toca archivos dentro de licitaciones/ (data.json y el registro
# de muestra). No modifica ninguna otra parte del sitio.
#
# Tiene TRES fuentes posibles:
#   - "ocp" (por defecto, la que corre sola todos los días): el mirror OCDS de
#     Open Contracting Partnership. Ya probada en producción, es la que se usa
#     sin tocar nada.
#   - "oece" (solo manual, botón "Run workflow"): el portal oficial peruano
#     contratacionesabiertas.oece.gob.pe, con datos más al día (incluye el mes
#     en curso) — pero automatizada con un navegador (Playwright) porque el
#     sitio bloquea peticiones HTTP simples, y ESTA RUTA TODAVÍA NO SE HA
#     PROBADO EN VIVO.
#   - "seace" (solo manual): el CSV que exporta directamente el portal SEACE
#     "Oportunidades de Negocio v2.0" (prod4.seace.gob.pe/openegocio) — la
#     MISMA fuente del CSV que se subió a mano para construir csv_to_data.py,
#     así que reutiliza ese parser ya probado tal cual. TAMPOCO se ha podido
#     probar en vivo todavía.
# Las dos últimas están como jobs aparte y solo manuales a propósito: si fallan
# o hace falta ajustar selectores, no arriesgan romper la sincronización
# diaria que ya funciona.
#
# SOBRE LA DIFERENCIA DE COBERTURA vs "Oportunidades de Negocio v2.0" del SEACE
# --------------------------------------------------------------------------------
# El propio portal SEACE (prod4.seace.gob.pe/openegocio) reporta ~3,300+
# oportunidades vigentes a nivel nacional; la fuente "ocp" que corre sola cada
# día hoy trae ~540. La causa más probable (no confirmada aún con datos reales
# masivos, solo con 1 ejemplo) es que el campo tenderPeriod.endDate — el que
# se usa para decidir si un proceso sigue vigente — no es confiable en este
# dataset específico de Perú: en el único release real inspeccionado, ese
# campo ya estaba vencido para cuando se procesó el archivo, y CADA convocatoria
# que hoy aparece en data.json llegó por el camino de respaldo (sin fecha
# límite, publicada hace ≤30 días), no por tener una fecha límite futura real.
# sync.py ahora guarda licitaciones/_diagnostico_campos.json en cada corrida
# con estadísticas reales sobre miles de releases (ver _diagnosticar_release()
# en sync.py) — revisar ese archivo después de la próxima corrida antes de
# decidir si hay que ajustar el filtro de vigencia.

on:
  schedule:
    # 11:00 UTC = 06:00 hora de Lima. Ajustar si se prefiere otro horario.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      fuente:
        description: "Fuente de datos a usar"
        type: choice
        options:
          - ocp
          - oece
          - seace
        default: ocp

permissions:
  contents: write

jobs:
  sync-ocp:
    # Corre todos los días por el cron, y también a mano si se elige "ocp"
    # (o se deja el valor por defecto) en "Run workflow".
    if: github.event_name == 'schedule' || github.event.inputs.fuente == 'ocp'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar sincronización (mirror OCP)
        run: python licitaciones/sync.py

      - name: Confirmar y subir cambios (solo si hubo cambios)
        run: |
          git config user.name "humen-licitaciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add licitaciones/data.json licitaciones/sample_raw_release.json
          [ -f licitaciones/_diagnostico_campos.json ] && git add licitaciones/_diagnostico_campos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza licitaciones - fuente OCP ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

  sync-oece:
    # SOLO manual: elegir "oece" en "Run workflow". No probado en vivo todavía
    # — si falla, revisa el log y la screenshot que sube como artifact.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fuente == 'oece'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Descargar el archivo del mes más reciente (navegador real)
        run: python licitaciones/scrape_oece.py --out licitaciones/descargas

      - name: Convertir a data.json (reutiliza el parser de sync.py)
        run: python licitaciones/oece_json_to_data.py "licitaciones/descargas/*.zip"

      - name: Subir screenshot/zip de depuración (siempre, para poder revisar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oece-debug
          path: licitaciones/descargas/
          retention-days: 7
          if-no-files-found: ignore

      - name: Confirmar y subir cambios (solo si hubo cambios)
        run: |
          git config user.name "humen-licitaciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add licitaciones/data.json licitaciones/sample_raw_release.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza licitaciones - fuente OECE ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

  sync-seace:
    # SOLO manual: elegir "seace" en "Run workflow". No probado en vivo
    # todavía — si falla, revisa el log y el artifact de depuración.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fuente == 'seace'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Descargar el CSV (navegador real, sin filtros — cobertura nacional)
        run: python licitaciones/scrape_seace_csv.py --out licitaciones/descargas

      - name: Convertir a data.json (mismo parser probado con el CSV manual)
        run: python licitaciones/csv_to_data.py licitaciones/descargas/*.csv

      - name: Subir CSV/screenshot de depuración (siempre, para poder revisar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seace-debug
          path: licitaciones/descargas/
          retention-days: 7
          if-no-files-found: ignore

      - name: Confirmar y subir cambios (solo si hubo cambios)
        run: |
          git config user.name "humen-licitaciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add licitaciones/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se crea commit."
          else
            git commit -m "Actualiza licitaciones - fuente SEACE CSV ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
