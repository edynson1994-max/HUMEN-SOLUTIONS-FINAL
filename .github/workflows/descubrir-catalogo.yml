name: Descubrir catálogo PNDA (Fase 3 - Perú en Datos)

# Corre connectors/discovery.py: recorre TODO el portal de datos abiertos
# (package_list + package_show por cada dataset, ~4,600 a la fecha),
# clasifica cuáles son de Economía y Finanzas, y prueba en vivo cuáles
# recursos tienen la Data API activada. Escribe data/catalog.json.
#
# SOLO MANUAL a propósito (sin "schedule" / cron): esta es la Fase 3,
# todavía no conectada a nada del frontend — se corre a mano para revisar
# el resultado antes de avanzar a la Fase 4 (sincronización genérica de
# los datasets que aparezcan aquí). El cron automático llega en la Fase 5,
# cuando discovery + sync corran juntos.
#
# SE PUEDE CORTAR Y CONTINUAR — corregido tras la primera corrida real
# contra el portal completo (2026-08-22), que iba camino a superar el
# límite de tiempo del job y hubiera perdido TODO lo procesado (antes,
# discovery.py solo guardaba resultados al terminar). Ahora:
#   - discovery.py se detiene solo ("max_minutos") ANTES de que GitHub
#     Actions mate el job por su propio timeout-minutes, guardando
#     ordenadamente lo que llevaba y con "siguiente_empezar_en" listo.
#   - Además guarda un catalog.json parcial cada 200 datasets
#     ("--checkpoint-cada", fijo en discovery.py) por si algo más corta
#     la corrida de golpe (cancelación manual, caída del runner).
#   - Si "Run workflow" te dice que la corrida quedó parcial, revisa
#     "siguiente_empezar_en" en el resumen del run y vuelve a correr el
#     workflow poniendo ese número en el campo "empezar_en" — así
#     continúas exactamente donde quedó, sin repetir ni saltarte nada.
#
# CONTINUACIÓN AUTOMÁTICA SI SE DEJA "empezar_en" VACÍO (agregado junto
# con el fix del bug de acumulación de discovery.py — ver README de
# connectors/): antes, el campo "empezar_en" del formulario tenía como
# default fijo "0", así que cualquiera que le diera a "Run workflow" sin
# tocar ese campo a mano disparaba sin querer una corrida desde el
# principio del portal. Combinado con el bug de que discovery.py pisaba
# el catalog.json entero en vez de acumular, esto es justo lo que borró
# en silencio el progreso real varias veces en producción. Ahora:
#   - discovery.py YA ACUMULA sobre el catalog.json existente en vez de
#     reemplazarlo (el bug de fondo está arreglado), así que un
#     "empezar_en" equivocado ya no puede destruir lo ya descubierto.
#   - Además, igual que en "Sincronizar datasets de Economía y Finanzas",
#     el campo por defecto ahora queda VACÍO, y un paso "Calcular desde
#     dónde continuar" lo resuelve automáticamente leyendo
#     "siguiente_empezar_en" del catalog.json ya commiteado — así ni
#     siquiera hace falta copiar el número a mano entre corridas.
#   - El campo del formulario sigue disponible para forzar un punto de
#     partida distinto si hace falta (ej. re-verificar un tramo puntual).
#
# Para una primera prueba rápida, usa "Run workflow" y pon un número
# pequeño en "limit" (ej. 20).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Procesar solo los primeros N datasets desde 'empezar_en' (vacío = todos los que queden)"
        required: false
        default: ""
      empezar_en:
        description: "Forzar desde qué índice empezar (vacío = automático: sigue donde quedó la corrida anterior leyendo catalog.json, ver arriba)"
        required: false
        default: ""
      max_minutos:
        description: "Detenerse ordenadamente (guardando avance) después de este tiempo, dejando margen antes del límite del job"
        required: false
        default: "100"
      probar_data_api:
        description: "Para qué datasets probar en vivo si tienen Data API"
        required: false
        default: "economia-finanzas"
        type: choice
        options:
          - economia-finanzas
          - todos
          - ninguno

permissions:
  contents: write

jobs:
  descubrir-catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular desde dónde continuar
        id: continuar
        env:
          EMPEZAR_EN_INPUT: ${{ github.event.inputs.empezar_en }}
        run: |
          # Mismo patrón que "Sincronizar datasets de Economía y Finanzas"
          # (ver sincronizar-economia-finanzas.yml). Prioridad:
          #   1) lo que puso la persona a mano en "Run workflow",
          #   2) "siguiente_empezar_en" del catalog.json ya commiteado
          #      (continuación automática — y ahora, con discovery.py ya
          #      acumulando en vez de pisar, siempre es seguro),
          #   3) 0 (primera corrida de todas, o catálogo ya completo —
          #      en ese caso discovery.py simplemente vuelve a acumular
          #      sobre lo mismo sin duplicar nada).
          if [ -n "$EMPEZAR_EN_INPUT" ]; then
            EMPEZAR_EN="$EMPEZAR_EN_INPUT"
            echo "Usando empezar_en del formulario: $EMPEZAR_EN"
          elif [ -f data/catalog.json ]; then
            EMPEZAR_EN=$(python3 - <<'PY'
          import json
          try:
              with open("data/catalog.json", encoding="utf-8") as f:
                  d = json.load(f)
              v = d.get("siguiente_empezar_en")
              print(v if v is not None else 0)
          except Exception:
              print(0)
          PY
          )
            echo "Continuando automáticamente desde la corrida anterior: empezar_en=$EMPEZAR_EN"
          else
            EMPEZAR_EN=0
            echo "No hay catalog.json todavía — empezando desde 0."
          fi
          echo "empezar_en=$EMPEZAR_EN" >> "$GITHUB_OUTPUT"

      - name: Ejecutar discovery.py
        env:
          EMPEZAR_EN: ${{ steps.continuar.outputs.empezar_en }}
          MAX_MINUTOS: ${{ github.event.inputs.max_minutos }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          # Defensivo: si algún input queda vacío (o esta corrida no vino
          # de un formulario), se cae a los defaults sensatos de abajo.
          MAX_MINUTOS="${MAX_MINUTOS:-100}"
          ARGS="--empezar-en $EMPEZAR_EN --max-minutos $MAX_MINUTOS"
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python connectors/discovery.py --probar-data-api "${{ github.event.inputs.probar_data_api }}" $ARGS

      - name: Mostrar un resumen rápido en la pestaña del run
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              with open("data/catalog.json", encoding="utf-8") as f:
                  d = json.load(f)
          except FileNotFoundError:
              print("No se generó data/catalog.json (falló antes de escribir el primer checkpoint).")
              raise SystemExit(0)
          print(f"**Estado:** {d.get('estado')} {'✅ corrida completa' if d.get('corrida_completa') else '⏸️ corrida parcial'}")
          print(f"**Datasets en el portal:** {d.get('total_datasets_portal')}")
          print(f"**Datasets acumulados en TOTAL (todas las corridas hasta ahora):** {d.get('total_datasets_procesados')}")
          print(f"**Nuevos/actualizados en ESTA corrida:** {d.get('datasets_nuevos_o_actualizados_en_esta_corrida')} (empezó en el índice {d.get('empezar_en_usado_esta_corrida')})")
          print(f"**Clasificados como Economía y Finanzas (acumulado total):** {d.get('total_clasificados_economia_finanzas')}")
          print(f"**Recursos con Data API confirmada:** {d.get('total_recursos_con_data_api_confirmada')}")
          print(f"**Errores acumulados:** {len(d.get('errores') or [])} ({d.get('errores_nuevos_en_esta_corrida')} nuevos en esta corrida)")
          print(f"**Tardó:** {d.get('minutos_que_tomo_esta_corrida')} minutos")
          if not d.get("corrida_completa"):
              print(f"\n⚠️ **La corrida quedó parcial.** Para continuar, vuelve a correr este workflow con `empezar_en = {d.get('siguiente_empezar_en')}`.")
          if d.get("errores"):
              print("\n| dataset_id | error |\n|---|---|")
              for e in d["errores"][:20]:
                  print(f"| {e['dataset_id']} | {e['error']} |")
          PY

      - name: Subir data/catalog.json como artifact (siempre, para revisar sin esperar el commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-pnda
          path: data/catalog.json
          retention-days: 14
          if-no-files-found: warn

      - name: Confirmar y subir cambios (siempre que exista el archivo, incluso si la corrida quedó parcial o el job se cortó)
        if: always()
        run: |
          if [ ! -f data/catalog.json ]; then
            echo "No hay data/catalog.json que confirmar (no se llegó a guardar ni un checkpoint)."
            exit 0
          fi
          git config user.name "peru-en-datos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo, no se crea commit."
            exit 0
          fi
          git commit -m "Descubre catálogo PNDA (Fase 3) - $(date -u +'%Y-%m-%d %H:%M UTC')"

          for intento in 1 2 3 4 5; do
            git fetch origin main
            if git merge origin/main --no-edit -X ours -m "Merge automático (descubrir-catalogo)"; then
              if git push origin main; then
                echo "Subido correctamente."
                exit 0
              fi
            fi
            echo "Intento $intento falló (probablemente otro push a la vez), reintentando..."
            sleep $((intento * 5))
          done
          echo "No se pudo subir después de varios intentos." >&2
          exit 1
