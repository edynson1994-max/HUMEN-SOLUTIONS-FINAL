<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gracias | HUMEN SOLUTIONS S.A.C.S.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Manrope',sans-serif;

background:#F8FAFC;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:30px;

}

.card{

background:#fff;

max-width:650px;

width:100%;

padding:60px;

border-radius:28px;

text-align:center;

box-shadow:0 25px 60px rgba(15,23,42,.08);

}

.check{

width:95px;

height:95px;

margin:auto;

border-radius:50%;

background:#6D8E34;

display:flex;

justify-content:center;

align-items:center;

font-size:48px;

color:#fff;

margin-bottom:30px;

}

h1{

color:#0B3C5D;

font-size:2.3rem;

margin-bottom:18px;

}

p{

color:#64748B;

font-size:1.1rem;

line-height:1.8;

margin-bottom:40px;

}

a{

display:inline-block;

background:#0B3C5D;

color:#fff;

padding:16px 34px;

border-radius:14px;

text-decoration:none;

font-weight:700;

transition:.3s;

}

a:hover{

background:#6D8E34;

}

</style>

</head>

<body>

<div class="card">

<div class="check">

✓

</div>

<h1>¡Gracias por contactarnos!</h1>

<p>

Hemos recibido tu solicitud correctamente.

Uno de nuestros asesores se comunicará contigo a la brevedad posible.

</p>

<a href="index.html">

Volver al sitio web

</a>

</div>

</body>

</html>
