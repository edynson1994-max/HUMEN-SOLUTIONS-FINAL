<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de dataset — Perú en Datos</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="shortcut icon" href="../images/favicon.png">
</head>
<body>
<style>
/* Fase 11 — ficha de dataset individual. Reutiliza EXACTAMENTE los
   mismos tokens de diseño que app.html (mismo :root, mismos nombres de
   variable) para que se vea como parte del mismo sitio, no como una
   página aparte — ver la sección "Fundamentals" del resto del proyecto:
   nunca se rediseña, solo se reutiliza lo que ya existe.
   Paleta alineada a humen.solutions (ver app.html): verde bosque como
   acento principal, oro cálido como secundario, Manrope como tipografía
   única. --error es nuevo aquí (app.html no lo usa) y se mantiene como
   un rojo aparte del verde de marca — si "carmin" ahora significa
   "acento principal" en vez de "algo salió mal", un estado de error
   necesita su propio color para seguir leyéndose como error. */
:root{
  --paper: #FDFCFA; --paper-raised: #FFFFFF; --ink: #26261F; --ink-soft: #6E6B5D;
  --line: #E6E0D0; --line-soft: #EFE9DC;
  --carmin: #33472A; --carmin-ink: #24331C; --carmin-bg: #F5F7F2;
  --oro: #B9975B; --oro-bg: #FAF5E9;
  --andes: #4F6B3A; --andes-bg: #EAF0E4;
  --ok: #3D7A45; --ok-bg: #E7F2E9;
  --error: #A3372B; --error-bg: #F7E6E2;
  --shadow: 0 1px 2px rgba(38,38,32,.06), 0 8px 24px -12px rgba(38,38,32,.16);
  --radius-s: 10px; --radius-m: 16px; --radius-l: 20px;
  --font-display: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Manrope", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper: #1A1F16; --paper-raised: #23291D; --ink: #ECE7DC; --ink-soft: #B3AB9C;
    --line: #38402F; --line-soft: #2E3527;
    --carmin: #86B26C; --carmin-ink: #A3C98C; --carmin-bg: #26301E;
    --oro: #D4B876; --oro-bg: #332A18;
    --andes: #9BBF7E; --andes-bg: #232A1B;
    --ok: #8FCB86; --ok-bg: #1E2A1C;
    --error: #E08578; --error-bg: #3A251F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper: #1A1F16; --paper-raised: #23291D; --ink: #ECE7DC; --ink-soft: #B3AB9C;
  --line: #38402F; --line-soft: #2E3527;
  --carmin: #86B26C; --carmin-ink: #A3C98C; --carmin-bg: #26301E;
  --oro: #D4B876; --oro-bg: #332A18;
  --andes: #9BBF7E; --andes-bg: #232A1B;
  --ok: #8FCB86; --ok-bg: #1E2A1C;
  --error: #E08578; --error-bg: #3A251F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance; color:var(--ink); }
p{ margin:0; }
a{ color:inherit; }
img,svg{ display:block; max-width:100%; }
.wrap{ max-width:860px; margin:0 auto; padding:32px 28px 64px; }
@media (max-width:640px){ .wrap{ padding:24px 18px 48px; } }
.tabular{ font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--font-mono); font-size:.72rem; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); }

.volver{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:.78rem; font-weight:600; color:var(--ink-soft); text-decoration:none; margin-bottom:22px; }
.volver:hover{ color:var(--carmin); }

.tag{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:.68rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:4px 9px; border-radius:100px; background:var(--andes-bg); color:var(--andes); }
.estado-pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:.72rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:5px 12px; border-radius:100px; }
.estado-pill.ok{ background:var(--ok-bg); color:var(--ok); }
.estado-pill.error{ background:var(--error-bg); color:var(--error); }
.estado-pill.pendiente{ background:var(--line-soft); color:var(--ink-soft); }

h1.titulo{ font-size:clamp(1.5rem,3.4vw,2.1rem); margin:14px 0 6px; }
.entidad{ color:var(--ink-soft); font-size:.95rem; }

.card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:26px; margin-top:20px; }
.card h2{ font-size:1.1rem; margin-bottom:14px; }
.stat-row{ display:flex; flex-wrap:wrap; gap:24px; }
.stat{ display:flex; flex-direction:column; gap:2px; }
.stat .v{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; }
.stat .k{ font-size:.78rem; color:var(--ink-soft); }
.stat .v.up{ color:var(--ok); }
.stat .v.down{ color:var(--carmin); }

.chart-wrap{ width:100%; height:120px; margin-top:16px; }

table.muestra{ width:100%; border-collapse:collapse; font-size:.82rem; }
table.muestra th, table.muestra td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
table.muestra th{ font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
.tabla-scroll{ overflow-x:auto; margin-top:14px; border:1px solid var(--line); border-radius:var(--radius-s); }

a.fuente-btn{ display:inline-flex; align-items:center; gap:8px; margin-top:16px; font-weight:700; font-size:.9rem; color:#fff; background:var(--carmin); padding:11px 20px; border-radius:100px; text-decoration:none; }
a.fuente-btn:hover{ opacity:.9; }

.estado-vacio{ background:var(--paper-raised); border:1px dashed var(--line); border-radius:var(--radius-m); padding:24px; color:var(--ink-soft); font-size:.92rem; line-height:1.6; }
</style>

<div class="wrap" id="app">
  <a class="volver" href="app.html#explora">← Volver al catálogo</a>
  <div id="contenido">
    <p class="eyebrow">Cargando…</p>
  </div>
</div>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function fmtFechaCorta(iso){
    if (!iso) return '—';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString('es-PE', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    } catch (e) { return iso; }
  }
  function sparklineSVG(data, color){
    if (!data || data.length < 2) return '';
    var w = 760, h = 120, pad = 6;
    var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
    var range = (max - min) || 1;
    var step = (w - pad*2) / (data.length - 1);
    var pts = data.map(function(v,i){ return [pad + i*step, pad + (h - pad*2) * (1 - (v - min)/range)]; });
    var line = pts.map(function(p,i){ return (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
    var area = line + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
    var last = pts[pts.length-1];
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible;color:var(--ink-soft)">' +
      '<defs><linearGradient id="dsg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="'+area+'" fill="url(#dsg)" />' +
      '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />' +
      '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="'+color+'" />' +
    '</svg>';
  }

  function params(){ return new URLSearchParams(window.location.search); }
  var datasetId = params().get('id');
  var contenido = document.getElementById('contenido');

  function mostrarNoEncontrado(motivo){
    contenido.innerHTML = '<div class="estado-vacio">' + escapeHtml(motivo) + '</div>';
  }

  if (!datasetId) {
    mostrarNoEncontrado('Falta el parámetro "id" en la URL — esta página se abre desde una tarjeta del catálogo, no directamente.');
  } else {
    Promise.all([
      fetch('../data/catalog.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
      fetch('../data/sources/' + encodeURIComponent(datasetId) + '/latest.json').then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
      fetch('../data/sources/' + encodeURIComponent(datasetId) + '/history.jsonl').then(function(r){ return r.ok ? r.text() : null; }).catch(function(){ return null; })
    ]).then(function(res){
      var catalog = res[0], latest = res[1], historyText = res[2];

      var entrada = null;
      if (catalog && Array.isArray(catalog.datasets)) {
        entrada = catalog.datasets.filter(function(d){ return d.dataset_id === datasetId; })[0] || null;
      }

      if (!entrada && !latest) {
        mostrarNoEncontrado('No se encontró este dataset ni en el catálogo ni en los datos sincronizados. Puede que el id venga de un enlace viejo, o que el catálogo todavía no llegó a este dataset en su descubrimiento.');
        return;
      }

      var historia = [];
      if (historyText) {
        historyText.split('\n').forEach(function(linea){
          linea = linea.trim();
          if (!linea) return;
          try { historia.push(JSON.parse(linea)); } catch (e) { /* línea corrupta, se ignora */ }
        });
      }

      var titulo = (entrada && entrada.titulo) || (latest && latest.titulo) || datasetId;
      var entidad = entrada && entrada.entidad;
      var datasetUrl = (entrada && entrada.dataset_url) || (latest && latest.dataset_url);
      var estado = latest ? latest.estado : null;
      var estadoLabel = estado === 'ok' ? 'Sincronizado' : estado === 'error' ? 'Error de sincronización' : estado === 'formato_no_soportado' ? 'Formato no soportado' : 'Todavía no sincronizado';
      var estadoClase = estado === 'ok' ? 'ok' : estado === 'error' ? 'error' : 'pendiente';

      var html = '';
      html += '<span class="tag">' + escapeHtml((entrada && entrada.categoria) || 'Sin categorizar') + '</span> ';
      html += '<span class="estado-pill ' + estadoClase + '">' + estadoLabel + '</span>';
      html += '<h1 class="titulo">' + escapeHtml(titulo) + '</h1>';
      if (entidad) html += '<p class="entidad">' + escapeHtml(entidad) + '</p>';

      // ---- Estado de sincronización + tendencia ----
      html += '<div class="card"><h2>Estado de sincronización</h2>';
      if (latest && latest.estado === 'ok') {
        var cambio = latest.cambio_vs_corrida_anterior;
        html += '<div class="stat-row">';
        html += '<div class="stat"><span class="v tabular">' + (latest.filas_leidas != null ? latest.filas_leidas.toLocaleString('es-PE') : '—') + '</span><span class="k">filas en la última corrida</span></div>';
        if (cambio && (cambio.tipo === 'aumento' || cambio.tipo === 'disminucion')) {
          var up = cambio.tipo === 'aumento';
          html += '<div class="stat"><span class="v tabular ' + (up?'up':'down') + '">' + (up?'▲ +':'▼ ') + cambio.diferencia.toLocaleString('es-PE') + '</span><span class="k">filas vs. la corrida anterior' + (cambio.diferencia_pct != null ? ' (' + (cambio.diferencia_pct>0?'+':'') + cambio.diferencia_pct.toFixed(1).replace('.',',') + '%)' : '') + '</span></div>';
        } else if (cambio && cambio.tipo === 'primera_sincronizacion') {
          html += '<div class="stat"><span class="v">Primera vez</span><span class="k">todavía no hay una corrida anterior para comparar</span></div>';
        }
        html += '<div class="stat"><span class="v">' + escapeHtml(latest.nivel_usado || '—') + '</span><span class="k">método usado (Data API / URL en vivo / URL fija)</span></div>';
        html += '<div class="stat"><span class="v">' + fmtFechaCorta(latest.generado_en) + '</span><span class="k">última sincronización</span></div>';
        html += '</div>';

        var serieFilas = historia.filter(function(h){ return h.estado === 'ok' && h.filas != null; }).map(function(h){ return h.filas; });
        if (serieFilas.length >= 2) {
          html += '<div class="chart-wrap">' + sparklineSVG(serieFilas, 'var(--carmin)') + '</div>';
          html += '<p class="eyebrow" style="margin-top:6px;">filas por corrida, últimas ' + serieFilas.length + ' sincronizaciones exitosas</p>';
        }
      } else if (latest) {
        html += '<p style="color:var(--ink-soft);">La sincronización más reciente (' + fmtFechaCorta(latest.generado_en) + ') no trajo datos: <strong>' + escapeHtml(latest.error || (latest.errores_por_nivel ? JSON.stringify(latest.errores_por_nivel) : latest.formato || 'sin detalle')) + '</strong></p>';
      } else {
        html += '<p style="color:var(--ink-soft);">Este dataset todavía no fue sincronizado — está en el catálogo, pero el cron de sincronización aún no le tocó el turno.</p>';
      }
      html += '</div>';

      // ---- Muestra de datos ----
      if (latest && latest.estado === 'ok' && Array.isArray(latest.columnas_detectadas) && Array.isArray(latest.muestra) && latest.muestra.length) {
        var cols = latest.columnas_detectadas;
        html += '<div class="card"><h2>Muestra de los datos (primeras ' + latest.muestra.length + ' filas tal como llegaron)</h2>';
        html += '<div class="tabla-scroll"><table class="muestra"><thead><tr>' + cols.map(function(c){ return '<th>' + escapeHtml(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        latest.muestra.forEach(function(fila){
          html += '<tr>' + cols.map(function(c){ return '<td title="' + escapeHtml(fila[c]) + '">' + escapeHtml(fila[c]) + '</td>'; }).join('') + '</tr>';
        });
        html += '</tbody></table></div></div>';
      }

      // ---- Fuente oficial ----
      html += '<div class="card"><h2>Fuente</h2>';
      html += '<p style="color:var(--ink-soft); font-size:.9rem;">Perú en Datos no publica estos datos — los lee del Portal Nacional de Datos Abiertos y los muestra tal como los recibe.</p>';
      if (datasetUrl) {
        html += '<a class="fuente-btn" href="' + datasetUrl + '" target="_blank" rel="noopener noreferrer">Ver dataset oficial ↗</a>';
      }
      html += '</div>';

      contenido.innerHTML = html;
      document.title = titulo + ' — Perú en Datos';
    });
  }

  // tema, igual que app.html
  var root = document.documentElement;
  try {
    if (window.top && window.top !== window) {
      var t = window.top.document.documentElement.getAttribute('data-theme');
      if (t) root.setAttribute('data-theme', t);
    }
  } catch (e) { /* origen cruzado: se queda con el tema del sistema */ }
})();
</script>

<script>
(function(){
  function reportHeight(){
    var h = document.documentElement.scrollHeight;
    if (window.parent) window.parent.postMessage({ type: 'ped-height', height: h }, '*');
  }
  window.addEventListener('load', reportHeight);
  window.addEventListener('resize', reportHeight);
  if (window.ResizeObserver) { new ResizeObserver(reportHeight).observe(document.body); }
  else { setInterval(reportHeight, 800); }
  reportHeight();
})();
</script>
</body>
</html>
